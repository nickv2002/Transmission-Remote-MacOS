# A stand-in for an access proxy in front of the fixture daemon, published on
# host port 19092 (see docker-compose.yml). Used by Tests/FixtureProxyTests.swift.
#
#   /redirect/...  always answers 302 to a login page on another host, the way an
#                  access proxy does when a request lacks valid credentials.
#   /gated/...     forwards to the daemon only when X-Fixture-Token matches,
#                  otherwise 403 — the custom-header path.
events {}

http {
    server {
        listen 80;

        location /redirect/ {
            return 302 https://login.fixture.invalid/login?return_to=$request_uri;
        }

        location /gated/ {
            if ($http_x_fixture_token != "fixture-token") {
                return 403;
            }
            # The trailing slash strips /gated/, so /gated/transmission/rpc
            # reaches the daemon as /transmission/rpc.
            proxy_pass http://transmission-fixture:9091/;
        }
    }
}
