# A stand-in for an access proxy in front of the fixture daemon, published on
# host port 19092 (see docker-compose.yml). Used by Tests/FixtureProxyTests.swift.
#
#   /redirect/...  always answers 302 to a login page on another host, the way an
#                  access proxy does when a request lacks valid credentials.
#   /gated/...     forwards to the daemon only when X-Fixture-Token matches,
#                  otherwise 403 — the custom-header path.
#   /access/...    mimics Cloudflare Access with Managed OAuth: without the
#                  expected cf-access-token it answers 401 with a Bearer
#                  challenge naming resource metadata, otherwise it forwards.
#   /access-legacy/... mimics an Access app with Managed OAuth off: a 302 to
#                  the Access login page (/cdn-cgi/access/login).
events {}

http {
    server {
        listen 80;

        location /redirect/ {
            return 302 https://login.fixture.invalid/login?return_to=$request_uri;
        }

        location /access/ {
            if ($http_cf_access_token != "fixture-access-token") {
                add_header WWW-Authenticate 'Bearer realm="OAuth", error="invalid_token", resource_metadata="https://localhost/.well-known/cloudflare-access-protected-resource/access/transmission/rpc"' always;
                return 401 '{"error":"invalid_token"}';
            }
            proxy_pass http://transmission-fixture:9091/;
        }

        location /access-legacy/ {
            return 302 https://fixture-team.cloudflareaccess.com/cdn-cgi/access/login/localhost?kid=fixture-aud&redirect_url=$request_uri;
        }

        location /gated/ {
            if ($http_x_fixture_token != "fixture-token") {
                return 403;
            }
            # The trailing slash strips /gated/, so /gated/transmission/rpc
            # reaches the daemon as /transmission/rpc.
            proxy_pass http://transmission-fixture:9091/;
        }
    }
}
