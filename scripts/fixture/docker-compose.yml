services:
  transmission-fixture:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transgui-fixture-transmission
    environment:
      - PUID=${PUID:-502}
      - PGID=${PGID:-20}
      - TZ=Etc/UTC
      - USER=fixture
      - PASS=fixture-pass
    volumes:
      - ./.data/config:/config
      - ./.data/downloads:/downloads
    # A small separate filesystem, so free-space for a path on another mount can
    # be told apart from the root/downloads filesystem (issue #20).
    tmpfs:
      - /othermount:size=64m
    ports:
      # RPC port 19091 on the host maps to the container's internal 9091.
      # NEVER change the host side to 9091 — that is the owner's real
      # production Transmission server's port.
      - "19091:9091"
    restart: "no"

  # Access-proxy stand-in (redirect-to-login and header-gated paths), see
  # nginx.conf. Host port 19092 — like 19091, never the production 9091.
  proxy-fixture:
    image: nginx:1.27-alpine
    container_name: transgui-fixture-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - transmission-fixture
    ports:
      - "19092:80"
    restart: "no"
